<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Kameron:wght@400..700&family=Orbitron:wght@400..900&family=Roboto+Mono:ital,wght@0,100..700;1,100..700&display=swap"

<body>
    <h1>Generate a</h1>
    <h1 id="clr">random Password</h1>
    <p>Never use an insecure password again</p>
    <label for="num">Enter Password Length (8-16)</label>
    <input type="number" id="num" min="8" max="16">

    <button id="Pass-gen" onclick="randomPasswordGenerator()">Generate Passwords</button>

    <div id="container">
        <div id="pass1"></div>
        <div id="pass2"></div>
    </div>


    <script src="script.js"></script>
</body>
